/// C Finnegans Wake deck: configuration. The text is in I.1.deck ... IV.deck,
/// C generated by tools/mkdeck.py from the collation of the witnesses (see
/// C index.deck and tools/).
/// C Italics, marked with "_" in the text.
/// +it (?P<open>_)[^_]+(?P<close>_)
/// +html.title Finnegans Wake
/// C The text face: Source Serif, a modern design after Fournier, the type of
/// C the Faber 1939 and Viking 1958 printings.
/// +html.head <link rel="preconnect" href="https://fonts.googleapis.com">
/// +html.head <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
/// C Sigla, written "*E*" as in Fweet, are set in the Fweet Figla font of
/// C Raphael Slepon (after a font of Michael Powers), https://www.fweet.org/pages/fw_font.php.
/// +cd (?P<open>\*)[ACEFIJKLMOPQSTVWXY](?P<close>\*)
/// +html.style @font-face { font-family: "Fweet Figla"; src: url("fonts/FweetFig.ttf") format("truetype"); }
/// +html.style code.inline { font-family: "Fweet Figla"; font-size: 1.1em; background: none; color: inherit; padding: 0; }
/// C Show the identifier (page and line) of every fragment.
/// +frag.id.show +
/// +html.style span.frag-id { font-family: "Source Serif 4", Georgia, serif; font-size: 11px; }
/// C The identifiers are positioned just left of the text, out of the flow, so
/// C that they stay aligned with their lines next to the marginalia of II.2.
/// C A column of the width of the printed measure, with wide margins for the
/// C identifiers, the marginalia of II.2 and the notes.
/// C The left margin holds only the identifiers and the marginalia of II.2; the
/// C right margin, the notes, takes the rest of the width.
/// +html.style .column { position: relative; max-width: 590px; margin-left: 240px; margin-right: auto; }
/// C The layout of the lines of the pages is in layout.conf (generated).
/// +html.style p.margin-left { position: absolute; float: none; margin: 0 0 0 -66px; width: 58px; max-width: none; text-align: right; line-height: 1.45; font-size: 20px; }
/// C The notes of a line run on in the right margin, in small type; the notes of
/// C successive lines stack, never overlap.
/// +html.style p.margin-right { clear: right; margin-right: -640px; max-width: 600px; width: 600px; margin-top: 0; margin-bottom: 0; font-size: 11px; line-height: 14px; display: flex; flex-wrap: wrap; column-gap: 0.3em; }
/// +html.style p.margin-right br { display: none; }
/// C Footnotes (variants, readings): small, as the apparatus of an edition.
/// +html.style p.footnote { font-size: 14px; line-height: 1.4; text-align: left; text-align-last: auto; min-width: 0; }
/// C The entries of the apparatus run on, as in a printed edition.
/// +html.style div.footnotes p.footnote { display: inline; margin-right: 1.2em; }
/// +html.style p.margin-right span.annotation { margin-right: 0.6em; white-space: nowrap; }
/// +html.head <script async src="https://www.googletagmanager.com/gtag/js?id=G-WEM34DWDR2"></script>
/// +html.head <script>
/// +html.head      window.dataLayer = window.dataLayer || [];
/// +html.head      function gtag(){dataLayer.push(arguments);}
/// +html.head      gtag('js', new Date());
/// +html.head      gtag('config', 'G-WEM34DWDR2');
/// +html.head </script>
/// C One fragment per printed line: no space between the lines.
